<!-- ===== CHATBOT PARFUMS : STRUCTURE (HTML) ===== -->
<link rel="stylesheet" href="chatbot.css">

<!-- Bouton rond qui ouvre / ferme le chatbot -->
<button id="chat-bouton" aria-label="Ouvrir le chatbot">💬</button>

<!-- Fenêtre de discussion (cachée au départ) -->
<div id="chat-fenetre" class="cache">
  <div id="chat-entete">Conseiller parfums</div>

  <!-- Zone où s'affichent les messages et les réponses -->
  <div id="chat-messages"></div>

  <!-- Zone des boutons de choix (le client clique, il n'écrit pas) -->
  <div id="chat-options"></div>
</div>

<script src="chatbot.js"></script>
